<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120d18" />
    <title>Никич - Сделка с дьяволом</title>
    <style>
      /* Страница игры: холст на всё окно с первого кадра, своя полоса загрузки в цветах игры (style.css TS: --c-bg, --c-accent). */
      :root {
        --c-bg: #120d18;
        --c-text: #f1e9ff;
        --c-dim: #a99bbd;
        --c-accent: #ff7a2f;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--c-bg);
        color: var(--c-text);
        font-family: 'Cormorant Garamond', Constantia, Palatino, Georgia, serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        background: var(--c-bg);
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--c-bg);
        transition: opacity 0.4s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader h1 {
        margin: 0;
        font-size: clamp(40px, 9vw, 88px);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffb36b;
        text-shadow: 0 0 24px rgb(255 122 47 / 45%);
      }
      #bar {
        width: min(320px, 70vw);
        height: 4px;
        border-radius: 2px;
        background: rgb(255 255 255 / 10%);
        overflow: hidden;
      }
      #fill {
        width: 0;
        height: 100%;
        background: var(--c-accent);
        transition: width 0.2s ease;
      }
      #status {
        font-size: 18px;
        font-style: italic;
        color: var(--c-dim);
        text-align: center;
        max-width: 80vw;
      }
      #status.error {
        color: #ff8a70;
        font-style: normal;
      }
      @media (prefers-reduced-motion: reduce) {
        #loader,
        #fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loader">
      <h1>Nikich</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status"></div>
    </div>
    <script>
      (function () {
        var ru = /^(ru|uk|be|kk)\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '');
        var text = ru
          ? { loading: 'Загрузка…', starting: 'Разогреваем котлы…', failed: 'Игра не запустилась: ' }
          : { loading: 'Loading…', starting: 'Heating up the cauldrons…', failed: 'The game failed to start: ' };
        var canvas = document.getElementById('game');
        var loader = document.getElementById('loader');
        var fill = document.getElementById('fill');
        var status = document.getElementById('status');
        status.textContent = text.loading;

        var buildUrl = 'Build';
        var config = {
          dataUrl: buildUrl + '/Web.data.unityweb',
          frameworkUrl: buildUrl + '/Web.framework.js.unityweb',
          codeUrl: buildUrl + '/Web.wasm.unityweb',
          streamingAssetsUrl: 'StreamingAssets',
          companyName: "nikich-deal",
          productName: "Никич - Сделка с дьяволом",
          productVersion: "0.1.0",
          // Сейвы (persistentDataPath) сами уходят в IndexedDB после каждой записи.
          autoSyncPersistentDataPath: true,
          showBanner: function (msg, type) {
            if (type === 'error') console.error(msg);
            else console.warn(msg);
          },
        };

        var script = document.createElement('script');
        script.src = buildUrl + '/Web.loader.js';
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            fill.style.width = Math.round(progress * 100) + '%';
            if (progress >= 1) status.textContent = text.starting;
          })
            .then(function (instance) {
              window.nikichInstance = instance;
              loader.classList.add('done');
              setTimeout(function () {
                loader.remove();
              }, 500);
              canvas.focus();
            })
            .catch(function (message) {
              status.textContent = text.failed + message;
              status.className = 'error';
            });
        };
        script.onerror = function () {
          status.textContent = text.failed + script.src;
          status.className = 'error';
        };
        document.body.appendChild(script);
        // Клавиши идут в игру и после клика мимо холста.
        document.addEventListener('pointerdown', function () {
          canvas.focus();
        });
      })();
    </script>
  </body>
</html>
